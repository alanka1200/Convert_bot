services:
  - type: web
    name: telegram-converter-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false          # вводится вручную в дашборде Render
      - key: WEBHOOK_URL
        sync: false          # будет: https://<имя-сервиса>.onrender.com/webhook
      - key: PYTHON_VERSION
        value: 3.11.0
